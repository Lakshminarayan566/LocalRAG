name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/docker/requirements.txt
          pip install pytest==8.3.4 pytest-asyncio==0.24.0 pytest-cov==6.0.0 pytest-mock==3.14.0
          pip install ruff==0.8.6

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q -k "not test_query_empty_results_handled"